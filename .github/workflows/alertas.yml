# Safety & Security: alertas no telemóvel. De 10 em 10 minutos (o GitHub pode atrasar) verifica o IPMA, o EMSC, o GDACS e o USGS
# e envia notificações para a app ntfy. Configura-se na ferramenta «Alertas no telemóvel» da app:
#   segredos NTFY_TOPICO e ALERTAS_CONFIG (Settings › Secrets and variables › Actions). Os segredos aparecem como *** nos registos,
#   que num repositório público qualquer pessoa pode ver. ALERTAS_CONFIG como variável ainda funciona, mas aí as zonas ficam visíveis.
# O estado (só resumos dos alertas já enviados) fica no ramo "alertas".
name: Alertas

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      teste:
        description: "Enviar também uma notificação de teste"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: alertas
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verificar fontes e enviar alertas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NTFY_TOPICO: ${{ secrets.NTFY_TOPICO }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          ALERTAS_CONFIG: ${{ secrets.ALERTAS_CONFIG || vars.ALERTAS_CONFIG }}
          TESTE: ${{ github.event_name == 'workflow_dispatch' && inputs.teste && '1' || '' }}
        run: |
          set -euo pipefail
          if [ -z "${NTFY_TOPICO}" ]; then echo "Falta o segredo NTFY_TOPICO: ver a ferramenta Alertas no telemóvel da app."; exit 0; fi
          git clone -q --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" app
          mkdir estado
          if git -C app fetch -q --depth 1 origin alertas 2>/dev/null; then git -C app show FETCH_HEAD:estado.json > estado/estado.json || rm -f estado/estado.json; fi
          node app/tools/alertas.mjs --estado estado/estado.json
          cd estado
          git init -q
          git checkout -q -b alertas
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estado.json
          git commit -q -m "Estado dos alertas"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" alertas
